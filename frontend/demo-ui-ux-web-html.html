/* =========================================================
   EduFocus · UI/UX refinement layer
   ========================================================= */
:root{
  --bg:#f4f6f3;
  --surface:#ffffff;
  --surface-soft:#f9fbf9;
  --ink:#20342c;
  --muted:#62736a;
  --line:#e1e8e2;
  --line-strong:#cbd8ce;
  --primary:#3f7661;
  --primary-dark:#2f604d;
  --primary-soft:#e8f1eb;
  --shadow:0 8px 24px rgba(32,52,44,.055);
  --radius:16px;
}

html{scroll-behavior:smooth;scroll-padding-top:88px}
body{font-size:15px;line-height:1.58;background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font-size:14px}
button{transition:background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}

/* Header */
.topbar{height:72px;padding:0 clamp(18px,2.4vw,38px);box-shadow:0 1px 0 rgba(25,45,35,.02)}
.brand{font-size:19px;gap:11px}
.brandmark{width:38px;height:38px;border-radius:11px;font-size:16px}
.brand-sub{font-size:12px}
.top-right{gap:14px}
.user-chip{font-size:13px}
.avatar{width:38px;height:38px}
.role-tag{font-size:11px;padding:6px 11px}

/* Full-bleed application shell: sidebar starts at viewport edge */
.layout{grid-template-columns:264px minmax(0,1fr);max-width:none;width:100%;margin:0;min-height:calc(100vh - 72px)}
.sidebar{position:sticky;top:72px;align-self:start;height:calc(100vh - 72px);min-height:540px;overflow-y:auto;padding:26px 17px 24px;background:#fbfcfa;border-right:1px solid var(--line)}
.side-label{font-size:11px;color:#77877e;letter-spacing:1px;padding:13px 13px 9px}
.nav{position:relative;gap:12px;padding:12px 13px;margin:4px 0;border-radius:10px;font-size:14px;line-height:1.4;color:#52645a}
.nav:hover{background:#f0f5f1;color:var(--ink)}
.nav.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:750}
.nav.active:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 4px 4px 0;background:var(--primary)}
.nav-ico{width:20px;font-size:16px}
.sidebar-foot{margin:30px 4px 0;padding:14px;border:1px solid #e5ece6;border-radius:12px;background:#f3f7f3;font-size:12px;line-height:1.55}
.main{width:100%;max-width:1680px;margin:0 auto;padding:34px clamp(24px,3.25vw,58px) 72px;min-width:0}

/* Page hierarchy */
.page-head{align-items:center;margin-bottom:26px;gap:24px}
.eyebrow{font-size:11px;letter-spacing:1px;margin-bottom:8px}
.h1{font-size:clamp(28px,2vw,32px);line-height:1.2;letter-spacing:-.8px;margin-bottom:8px}
.sub{font-size:14px;line-height:1.6;max-width:850px}
.section-title{font-size:17px;line-height:1.35;letter-spacing:-.15px}
.section-sub{font-size:13px;line-height:1.5;margin-top:5px}

/* Buttons and interactive states */
.btn{min-height:40px;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700}
.btn-sm{min-height:34px;padding:7px 12px;font-size:12px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(31,65,48,.09)}
.btn:active{transform:translateY(0)}
.btn:focus-visible,.nav:focus-visible,.link-btn:focus-visible,.filter-tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(63,118,97,.23);outline-offset:2px}
.link-btn{font-size:13px;padding:5px 2px}

/* Cards, spacing and summary metrics */
.card{border-radius:16px;box-shadow:var(--shadow);border-color:var(--line);transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.pad{padding:22px}
.grid{gap:18px}
.metric{padding:20px 21px;min-height:112px}
.metric .value{font-size:30px;line-height:1.15;letter-spacing:-.8px}
.metric .label{font-size:14px;line-height:1.4;margin-top:5px;color:#596c61}
.metric .hint{font-size:12px;line-height:1.45;margin-top:8px;color:#7c8a81}
.badge{font-size:12px;padding:6px 11px;letter-spacing:.05px}
.tiny{font-size:12px;line-height:1.45}
.small{font-size:13px;line-height:1.5}
.muted{color:var(--muted)}

/* Course cards */
.course-card{padding:20px;gap:14px;min-height:204px}
.course-strip{height:5px;margin:-20px -20px 5px}
.course-code{font-size:12px;letter-spacing:.45px}
.course-name{font-size:17px;line-height:1.35;margin:5px 0}
.course-meta{font-size:13px;line-height:1.5;gap:4px}
.course-actions{gap:9px}
.course-card:hover{border-color:#cfddd2;box-shadow:0 12px 28px rgba(32,52,44,.085);transform:translateY(-2px)}
.live-banner{padding:14px 15px;border-radius:12px;gap:16px}
.live-banner strong{font-size:13px;line-height:1.4}
.live-banner p{font-size:12px;line-height:1.5;margin-top:4px}
.notice{padding:13px 15px;border-radius:11px;font-size:13px;line-height:1.55}

/* Forms */
.field{gap:7px;margin-bottom:16px}
.field label{font-size:13px}
.input,.select,.textarea{padding:12px 13px;border-radius:10px;font-size:14px;min-height:44px}
.field-hint{font-size:12px;line-height:1.5;color:#718078}
.filter-tab{padding:8px 13px;font-size:12px}

/* Tables and roster data */
.table{min-width:780px}
.table th{font-size:12px;padding:13px 14px;color:#64766b}
.table td{font-size:13px;padding:14px;line-height:1.45}
.student-cell{gap:11px}
.mini-avatar{height:34px;width:34px;font-size:11px}
.student-name{font-size:13px}
.student-id{font-size:11px;line-height:1.4}
.status-row{font-size:13px;padding:12px 0;gap:12px}
.status-chip{font-size:11px;padding:5px 9px}
.progress-track{height:11px}
.progress-legend{font-size:12px;gap:16px}
.roster-toolbar{margin:18px 0 14px;gap:12px}
.roster-toolbar .input{max-width:320px}

/* Secondary panels, dialogs and feedback */
.empty{padding:44px 20px}
.empty h3{font-size:16px}
.empty p{font-size:13px;line-height:1.5}
.footer-note{font-size:12px;line-height:1.55}
.modal{padding:26px;border-radius:17px}
.modal h3{font-size:19px}
.modal>p{font-size:13px;line-height:1.55}
.toast{font-size:13px;line-height:1.45;padding:14px 18px;border-radius:12px}
.auth-card{padding:32px}
.auth-card h1{font-size:26px}
.demo-box{font-size:12px;line-height:1.6}

/* Subtle, consistent scrolling */
*{scrollbar-width:thin;scrollbar-color:#cbd8ce transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:#cbd8ce;border:2px solid transparent;background-clip:padding-box;border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background:#aebfb2;border:2px solid transparent;background-clip:padding-box}

@media(max-width:1100px){
  .layout{grid-template-columns:238px minmax(0,1fr)}
  .sidebar{padding-left:13px;padding-right:13px}
  .main{padding-left:26px;padding-right:26px}
  .grid-4,.grid-5{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .layout{grid-template-columns:210px minmax(0,1fr)}
  .sidebar{padding:20px 10px}
  .main{padding:26px 20px 56px}

let db=load();
const state={user:null,route:'login',selectedCourseId:'HCI-K25.2',selectedSessionId:null,selectedStudentId:null,rosterFilter:'all',rosterQuery:'',cameraStream:null,cameraReady:false,privacyAccepted:false,elapsed:0,timer:null,paused:false,alertVariant:'A',cameraError:'',sessionFilter:'all',classCameraExpanded:false,teacherFeedPaused:false};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.courses)&&Array.isArray(v.sessions))return v}catch(e){}return defaultData()}

const $=(q,root=document)=>root.querySelector(q),$$=(q,root=document)=>[...root.querySelectorAll(q)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=s=>String(s||'?').split(/\s+/).slice(-2).map(x=>x[0]||'').join('').toUpperCase();
const btn=(label,action,cls='primary',extra='')=>`<button type="button" class="btn ${cls}" data-action="${action}" ${extra}>${label}</button>`;
const badge=(label,cls='b-grey')=>`<span class="badge ${cls}">${esc(label)}</span>`;
const head=(eyebrow,title,sub,right='')=>`<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="h1">${title}</h1><p class="sub">${sub}</p></div>${right?`<div class="toolbar">${right}</div>`:''}</div>`;
function course(id){return db.courses.find(c=>c.id===id)}
function activeSession(courseId){return db.sessions.find(s=>s.courseId===courseId&&s.status==='Đang diễn ra')||null}
function selectedCourse(){return course(state.selectedCourseId)||db.courses[0]}
function selectedSession(){return db.sessions.find(s=>s.id===state.selectedSessionId)||null}
function sessionForCourse(courseId){return db.sessions.filter(s=>s.courseId===courseId).sort((a,b)=>b.startedAt.localeCompare(a.startedAt))}
function toast(msg){toastRoot.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>toastRoot.innerHTML='',3200)}
function modal(title,body,actions=''){modalRoot.innerHTML=`<div class="overlay" data-action="overlay-close"><div class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><h3>${title}</h3><p>${body}</p>${actions}</div></div>`}
function closeModal(){modalRoot.innerHTML=''}
function role(){return state.user?.role||null}
function routeTo(r){if(!state.user){state.route=r==='register'?'register':r==='forgot'?'forgot':'login';render();return}const teacherRoutes=['teacher-home','teacher-course','teacher-session','teacher-student','teacher-reports'];const studentRoutes=['student-home','student-course','student-prepare','student-live','student-history','student-summary'];if(teacherRoutes.includes(r)&&role()!=='teacher'){toast('Khu vực này dành cho giảng viên.');return}if(studentRoutes.includes(r)&&role()!=='student'){toast('Khu vực này dành cho sinh viên.');return}state.route=r;closeModal();render();window.scrollTo({top:0,behavior:'smooth'})}
function logout(){stopCamera();clearInterval(state.timer);state.timer=null;state.user=null;state.route='login';state.selectedSessionId=null;save();render()}
function stopCamera(){if(state.cameraStream){state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=null}state.cameraReady=false}

ipsis">${esc(c.name)}</span></button>`).join('')}<div class="sidebar-foot"><strong>EduFocus</strong><br>Thông tin lớp và phiên trong bản demo dùng dữ liệu minh họa. Trạng thái quan sát không thay thế đánh giá của giảng viên.</div></aside><main class="main">${content}</main></div>`}

function statsForSession(s){const p=s?.participants||[];return{total:p.length,joined:p.filter(x=>x.status!=='absent').length,stable:p.filter(x=>x.status==='stable').length,attention:p.filter(x=>x.status==='attention').length,technical:p.filter(x=>x.status==='technical').length,absent:p.filter(x=>x.status==='absent').length}}
function statusBadge(status){const map={stable:['Đang ổn định','status-stable'],attention:['Cần xem xét','status-attention'],technical:['Lỗi thiết bị','status-technical'],absent:['Chưa tham gia','status-absent']};const [label,cls]=map[status]||['Chưa cập nhật','status-absent'];return `<span class="status-chip ${cls}">${label}</span>`}
function teacherHome(){const active=db.sessions.filter(s=>s.status==='Đang diễn ra');const totalStudents=db.courses.reduce((a,c)=>a+c.students,0);return shell(`${head('KHÔNG GIAN GIẢNG VIÊN',`Chào ${esc(state.user.name)}`,'Quản lý các lớp học phần, mở phiên học hoặc phiên thi và theo dõi tình hình tham gia của sinh viên.',btn('Xem báo cáo','teacher-reports','secondary'))}<div class="grid grid-3" style="margin-bottom:18px"><div class="card metric"><div class="value">${db.courses.length}</div><div class="label">Lớp học phần đang phụ trách</div><div class="hint">Các lớp được phân công cho tài khoản này</div></div><div class="card metric"><div class="value">${active.length}</div><div class="label">Phiên đang diễn ra</div><div class="hint">Có thể xem điểm danh theo từng lớp</div></div><div class="card metric"><div class="value">${totalStudents}</div><div class="label">Tổng lượt sinh viên thuộc lớp</div><div class="hint">Một sinh viên có thể học nhiều lớp</div></div></div><div class="row between wrap" style="margin-bottom:12px"><div><h2 class="section-title">Lớp học phần của tôi</h2><p class="section-sub">Chọn một lớp để xem sĩ số, mở phiên và quản lý buổi học.</p></div>${badge(`${db.courses.length} lớp phụ trách`,'b-green')}</div><div class="grid grid-2">${db.courses.map(c=>teacherCourseCard(c)).join('')}</div><div class="card pad" style="margin-top:18px"><div class="row between"><div><h2 class="section-title">Các phiên gần đây</h2><p class="section-sub">Tổng hợp từ các lớp bạn phụ trách.</p></div><button class="link-btn" data-route="teacher-reports">Xem tất cả →</button></div>${recentSessionsTable(db.sessions.slice().sort((a,b)=>b.startedAt.localeCompare(a.startedAt)).slice(0,5))}</div>`,'teacher-home')}
function teacherCourseCard(c){const s=activeSession(c.id);return `<article class="card course-card"><div class="course-strip" style="background:${c.color}"></div><div class="course-top"><div><div class="course-code">${esc(c.code)} · ${esc(c.section)}</div><div class="course-name">${esc(c.name)}</div><div class="course-meta"><span>${esc(c.schedule)} · ${esc(c.room)}</span><span>${c.students} sinh viên · ${esc(c.teacher)}</span></div></div>${s?badge('Đang mở phiên','b-green'):badge('Chưa mở phiên','b-grey')}</div>${s?`<div class="live-banner"><div><strong>${s.type==='exam'?'Phiên thi':'Phiên học'} đang diễn ra</strong><p>${esc(s.title)} · ${statsForSession(s).joined}/${c.students} đã tham gia</p></div>${btn('Mở dashboard','view-session','soft','data-id="'+s.id+'"')}</div>`:`<div class="notice info"><span>i</span><span>Chưa có phiên nào đang mở. Bạn có thể mở phiên học hoặc phiên thi để điểm danh.</span></div>`}<div class="course-actions">${btn('Mở lớp','open-course','secondary','data-id="'+c.id+'"')}${s?btn('Xem phiên','view-session','soft','data-id="'+s.id+'"'):btn('Mở phiên mới','open-course-session','primary','data-id="'+c.id+'"')}</div></article>`}
function classOverview(c){const s=activeSession(c.id);const sessionsFor=sessionForCourse(c.id);return shell(`<div class="breadcrumb"><button class="link-btn" data-route="teacher-home">Lớp học phần</button> / ${esc(c.code)}</div>${head('LỚP HỌC PHẦN',esc(c.name),`${esc(c.code)} · ${esc(c.section)} · ${c.students} sinh viên · ${esc(c.schedule)} · ${esc(c.room)}`,s?btn('Xem dashboard phiên','view-session','primary','data-id="'+s.id+'"'):btn('＋ Mở phiên học / thi','open-session-modal','primary'))}<div class="grid grid-3" style="margin-bottom:16px"><div class="card metric"><div class="value">${c.students}</div><div class="label">Sĩ số lớp</div><div class="hint">Danh sách sinh viên được ghi danh</div></div><div class="card metric"><div class="value">${sessionsFor.length}</div><div class="label">Phiên đã tổ chức</div><div class="hint">Học tập và kiểm tra</div></div><div class="card metric"><div class="value">${s?statsForSession(s).joined:0}</div><div class="label">Đã tham gia phiên hiện tại</div><div class="hint">${s?'Cập nhật khi sinh viên vào lớp':'Chưa có phiên đang diễn ra'}</div></div></div>${s?activeSessionOverview(c,s):`<div class="card pad"><div class="row between wrap"><div><h2 class="section-title">Chưa có phiên đang diễn ra</h2><p class="section-sub">Mở phiên học hoặc phiên thi để sinh viên trong lớp nhận được thông báo và tham gia.</p></div>${btn('Mở phiên học / thi','open-session-modal','primary')}</div><div class="notice info" style="margin-top:15px">Sau khi mở phiên, thông báo sẽ xuất hiện ở trang chủ của sinh viên đã đăng ký lớp này. Từng sinh viên được tính là đã tham gia khi tự vào phiên.</div></div>`}<div class="card pad" style="margin-top:16px"><div class="row between"><div><h2 class="section-title">Lịch sử phiên của lớp</h2><p class="section-sub">Xem các phiên học và phiên thi đã kết thúc.</p></div>${badge(`${sessionsFor.length} phiên`,'b-grey')}</div>${recentSessionsTable(sessionsFor)}</div>`,'teacher-home')}

function studentSnapshots(p){
 const types=/Nhắm mắt|Nhìn lệch|Cúi gục|Cúi đầu|Rời khỏi màn hình|Dấu hiệu cần xem lại/i;
 return (p?.events||[]).map((e,index)=>({...e,index})).filter(e=>e.snapshotAvailable||types.test(e.type));
}
function mockCameraFrame(name,status,index=0,variant='tile'){
 const offline=status==='technical'||status==='absent';
 const labels={technical:'Camera gián đoạn',absent:'Chưa tham gia',attention:'Tín hiệu cần xem lại',stable:'Đang kết nối'};
 return `<div class="mock-frame scene-${index%4} ${offline?'is-offline':''} ${variant==='snapshot'?'is-snapshot':''}">
  <div class="mock-frame-top"><span class="mock-camera-chip">${offline?'CAMERA OFFLINE':variant==='snapshot'?'FRAME DEMO':'LIVE · DEMO'}</span><span class="mock-frame-time">${variant==='snapshot'?'ẢNH MINH HỌA':'●'}</span></div>
  ${offline?`<div class="mock-offline"><span class="mock-offline-icon">${status==='technical'?'⌁':'◌'}</span><strong>${labels[status]||'Không có tín hiệu'}</strong><small>Không có hình ảnh trong bản demo</small></div>`:`<div class="mock-scene"><div class="mock-window"></div><div class="mock-person"><div class="person-head"><span>${esc(initials(name))}</span></div><div class="person-body"></div></div><div class="mock-desk"></div><div class="mock-scan-box"></div></div><div class="mock-frame-bottom"><span>${esc(name)}</span><span>${labels[status]||'Đang kết nối'}</span></div>`}
  <span class="mock-frame-watermark">EDUFOCUS · DEMO</span>
 </div>`;
}
function cameraTile(p,s,index){
 const joined=p.status!=='absent'&&p.status!=='technical';
 return `<article class="camera-tile ${p.status==='attention'?'needs-review':''}"><button class="camera-tile-preview" type="button" data-action="view-student" data-student="${p.id}" data-session="${s.id}" aria-label="Mở chi tiết ${esc(p.name)}">${mockCameraFrame(p.name,p.status,index)}</button><div class="camera-tile-info"><div class="camera-tile-person"><strong>${esc(p.name)}</strong><small>${esc(p.id)}</small></div>${statusBadge(p.status)}</div><div class="camera-tile-foot"><span class="camera-connection ${joined?'is-connected':''}"><i></i>${joined?'Đã kết nối':'Ngoại tuyến'}</span><button class="link-btn" data-action="view-student" data-student="${p.id}" data-session="${s.id}">Chi tiết</button></div></article>`;
}
function classCameraWall(s){
 const priority={attention:0,stable:1,technical:2,absent:3};
 const ordered=[...s.participants].sort((a,b)=>(priority[a.status]??4)-(priority[b.status]??4));
 const visible=state.classCameraExpanded?ordered:ordered.slice(0,8);
 const connected=s.participants.filter(p=>p.status==='stable'||p.status==='attention').length;
 return `<section class="card pad camera-wall-section"><div class="section-heading-row"><div><div class="eyebrow">THEO DÕI LỚP HỌC</div><h2 class="section-title">Camera toàn lớp</h2><p class="section-sub">Tổng quan trạng thái kết nối của ${s.participants.length} sinh viên trong phiên.</p></div><div class="camera-wall-summary"><strong>${connected}/${s.participants.length}</strong><span>camera mô phỏng kết nối</span></div></div><div class="camera-wall-toolbar"><div class="camera-legend"><span><i class="legend-dot connected"></i>Đang kết nối</span><span><i class="legend-dot warning"></i>Cần xem lại</span><span><i class="legend-dot offline"></i>Ngoại tuyến</span></div><span class="demo-disclosure">ⓘ Luồng hình ảnh được mô phỏng cho demo UI/UX</span></div><div class="camera-wall-grid">${visible.map((p,i)=>cameraTile(p,s,i)).join('')}</div>${ordered.length>8?`<div class="camera-wall-actions"><span class="muted small">${state.classCameraExpanded?'Đang hiển thị toàn bộ lớp':`Đang xem ${visible.length}/${ordered.length} sinh viên`}</span><button class="btn secondary btn-sm" data-action="toggle-camera-wall">${state.classCameraExpanded?'Thu gọn danh sách':'Xem toàn bộ '+ordered.length+' sinh viên'}</button></div>`:''}</section>`;
}
function snapshotCard(p,e,s,index){
 return `<article class="snapshot-card"><button class="snapshot-preview" data-action="view-snapshot" data-student="${p.id}" data-session="${s.id}" data-event-index="${e.index}" aria-label="Xem ảnh chụp của ${esc(p.name)}">${mockCameraFrame(p.name,'attention',index,'snapshot')}<span class="snapshot-open">⌕ Xem ảnh</span></button><div class="snapshot-content"><div class="row between wrap"><strong>${esc(e.type)}</strong>${badge('Cần xem lại','b-amber')}</div><p>${esc(p.name)} · ${esc(e.time)}</p><small>${esc(e.description||'Tín hiệu minh họa được ghi nhận trong phiên.')}</small></div></article>`;
}
function classEvidenceGallery(s){
 const items=s.participants.flatMap(p=>studentSnapshots(p).map(e=>({p,e}))).slice(0,6);
 return `<section class="card pad evidence-section"><div class="section-heading-row"><div><div class="eyebrow">MINH CHỨNG SỰ KIỆN</div><h2 class="section-title">Ảnh chụp cần xem lại</h2><p class="section-sub">Ảnh chụp minh họa gắn với các tín hiệu cần giảng viên kiểm tra thêm.</p></div>${badge(`${items.length} ảnh minh họa`,'b-amber')}</div>${items.length?`<div class="snapshot-grid">${items.map((x,i)=>snapshotCard(x.p,x.e,s,i)).join('')}</div>`:`<div class="empty evidence-empty"><h3>Chưa có ảnh chụp cần xem lại</h3><p>Thử tạo dữ liệu điểm danh minh họa để xem các tình huống mẫu.</p></div>`}<p class="evidence-footnote">Ảnh trong bản demo là khung hình giao diện dựng sẵn, không phải ảnh thật được ghi từ webcam sinh viên.</p></section>`;
}
function studentEvidenceGallery(p,s){

}

 const c=course(s.courseId);
 modalRoot.innerHTML=`<div class="overlay" data-action="overlay-close"><div class="modal modal-evidence" role="dialog" aria-modal="true" onclick="if(!event.target.closest('[data-action]'))event.stopPropagation()"><div class="modal-evidence-head"><div><span class="eyebrow">MINH CHỨNG SỰ KIỆN · DEMO</span><h3>${esc(e.type)}</h3><p>${esc(p.name)} · ${esc(e.time)} · ${esc(c?.name||'')}</p></div><button class="icon-close" data-action="close-modal" aria-label="Đóng">×</button></div><div class="snapshot-modal-frame">${mockCameraFrame(p.name,'attention',Number(eventIndex),'snapshot')}</div><div class="notice info" style="margin-top:16px">${esc(e.description||'Đây là hình ảnh mô phỏng được tạo cho bản demo UI/UX, không phải dữ liệu camera thực.')}</div><div class="modal-actions"><button class="btn secondary" data-action="close-modal">Đóng</button><button class="btn primary" data-action="view-student" data-student="${p.id}" data-session="${s.id}">Mở hồ sơ sinh viên</button></div></div></div>`;
}

 return `<section class="card pad student-live-monitor"><div class="section-heading-row"><div><div class="eyebrow">CAMERA CÁ NHÂN</div><h2 class="section-title">Theo dõi camera sinh viên</h2><p class="section-sub">Khung xem trực tiếp được mô phỏng trong prototype.</p></div>${badge(state.teacherFeedPaused?'Đã tạm dừng xem':'LIVE · MÔ PHỎNG',state.teacherFeedPaused?'b-grey':'b-green')}</div><div class="student-monitor-layout"><div class="student-live-frame ${state.teacherFeedPaused?'feed-paused':''}">${state.teacherFeedPaused?`<div class="feed-paused-state"><strong>Đã tạm dừng khung xem</strong><span>Nhấn tiếp tục để xem mô phỏng.</span></div>`:mockCameraFrame(p.name,p.status,2,'live')}</div><div class="student-monitor-meta"><div class="monitor-person"><div class="mini-avatar">${esc(initials(p.name))}</div><div><strong>${esc(p.name)}</strong><small>${esc(p.id)}</small></div></div><div class="status-row"><span>Tình trạng camera</span><strong>${feedAvailable?'Đang kết nối (demo)':p.status==='technical'?'Gián đoạn':'Chưa tham gia'}</strong></div><div class="status-row"><span>Trạng thái phiên</span>${statusBadge(p.status)}</div><div class="status-row"><span>Lần cập nhật mô phỏng</span><strong>Vừa cập nhật</strong></div><button class="btn ${state.teacherFeedPaused?'primary':'secondary'}" data-action="toggle-student-feed" style="width:100%;margin-top:14px">${state.teacherFeedPaused?'Tiếp tục xem':'Tạm dừng xem'}</button><small class="demo-disclosure block-disclosure">Prototype chỉ minh họa bố cục camera cá nhân. Không có luồng video thật từ thiết bị sinh viên.</small></div></div></section>`;

function activeSessionOverview(c,s){const st=statsForSession(s);const pct=x=>st.total?x/st.total*100:0;return `<div class="card pad session-overview-top" style="margin-bottom:15px"><div class="row between wrap"><div><div class="row wrap">${badge(s.type==='exam'?'PHIÊN THI':'PHIÊN HỌC',s.type==='exam'?'b-purple':'b-green')}${badge('Đang diễn ra','b-green')}</div><h2 class="section-title" style="font-size:19px;margin-top:8px">${esc(s.title)}</h2><p class="section-sub">Mã phiên ${esc(s.id)} · Bắt đầu ${esc(s.startedLabel)} · Thời lượng dự kiến ${s.duration} phút</p></div><div class="toolbar">${btn('Mô phỏng điểm danh lớp','seed-attendance','secondary',s.attendanceSeeded?'disabled':'')}${btn('Kết thúc phiên','confirm-end-session','danger','data-id="'+s.id+'"')}</div></div><div class="notice info" style="margin-top:14px">Các trạng thái và hình ảnh trong dashboard là dữ liệu minh họa. “Cần xem lại” là tín hiệu để kiểm tra ngữ cảnh, không phải kết luận sinh viên mất tập trung hay vi phạm.</div></div><div class="grid grid-5" style="margin-bottom:18px"><div class="card metric"><div class="value">${st.total}</div><div class="label">Sĩ số lớp</div></div><div class="card metric"><div class="value" style="color:var(--primary)">${st.joined}</div><div class="label">Đã tham gia</div></div><div class="card metric"><div class="value" style="color:var(--primary)">${st.stable}</div><div class="label">Tín hiệu ổn định</div></div><div class="card metric"><div class="value" style="color:var(--amber)">${st.attention}</div><div class="label">Cần xem xét</div></div><div class="card metric"><div class="value" style="color:var(--red)">${st.technical+st.absent}</div><div class="label">Lỗi thiết bị / chưa vào</div></div></div>${classCameraWall(s)}${classEvidenceGallery(s)}<div class="split" style="margin-top:18px"><div class="card pad"><div class="row between"><div><h2 class="section-title">Tình hình tham gia của cả lớp</h2><p class="section-sub">Theo dõi sĩ số và trạng thái từng sinh viên.</p></div><span class="small muted">${st.joined}/${st.total} đã tham gia</span></div><div class="progress-track" style="margin-top:18px"><span style="width:${pct(st.stable)}%;background:#6b967c"></span><span style="width:${pct(st.attention)}%;background:#d7a458"></span><span style="width:${pct(st.technical)}%;background:#c9766d"></span><span style="width:${pct(st.absent)}%;background:#dce2dc"></span></div><div class="progress-legend"><span><i class="stat-dot" style="background:#6b967c"></i>Ổn định (${st.stable})</span><span><i class="stat-dot" style="background:#d7a458"></i>Cần xem xét (${st.attention})</span><span><i class="stat-dot" style="background:#c9766d"></i>Lỗi thiết bị (${st.technical})</span><span><i class="stat-dot" style="background:#dce2dc"></i>Chưa tham gia (${st.absent})</span></div><div class="divider"></div><div class="row between"><h3 class="section-title">Danh sách sinh viên</h3>${badge('Nhấn vào tên để xem chi tiết','b-grey')}</div><div class="roster-toolbar"><input class="input" id="roster-search" value="${esc(state.rosterQuery)}" placeholder="Tìm tên hoặc mã sinh viên"><div class="filter-tabs">${[['all','Tất cả'],['stable','Ổn định'],['attention','Cần xem xét'],['technical','Lỗi thiết bị'],['absent','Chưa tham gia']].map(([v,l])=>`<button class="filter-tab ${state.rosterFilter===v?'active':''}" data-roster-filter="${v}">${l}</button>`).join('')}</div></div><div id="roster-table">${rosterRows(s,c)}</div></div><div class="card pad"><div class="row between"><div><h2 class="section-title">Những bạn cần xem lại</h2><p class="section-sub">Danh sách rút gọn để giảng viên kiểm tra.</p></div>${badge(`${st.attention+st.technical}`,'b-amber')}</div>${attentionList(s,c)}<div class="divider"></div><h3 class="section-title">Thông tin phiên</h3><div class="status-row"><span>Loại phiên</span><strong>${s.type==='exam'?'Phiên thi':'Phiên học'}</strong></div><div class="status-row"><span>Thời gian bắt đầu</span><strong>${esc(s.startedLabel)}</strong></div><div class="status-row"><span>Trạng thái</span>${badge('Đang diễn ra','b-green')}</div><div class="status-row"><span>Mã lớp</span><strong>${esc(c.id)}</strong></div>${btn('Xem báo cáo phiên','open-class-report','secondary','data-id="'+s.id+'" style="width:100%;margin-top:13px"')}</div></div>`}
function rosterRows(s,c){const q=state.rosterQuery.toLowerCase();const rows=s.participants.filter(p=>(state.rosterFilter==='all'||p.status===state.rosterFilter)&&(!q||p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)));return rows.length?`<div class="table-wrap"><table class="table" style="min-width:580px"><thead><tr><th>Sinh viên</th><th>Trạng thái</th><th>Tham gia lúc</th><th>Tín hiệu gần nhất</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td><div class="student-cell"><div class="mini-avatar">${esc(initials(p.name))}</div><div><div class="student-name">${esc(p.name)}</div><div class="student-id">${esc(p.id)}</div></div></div></td><td>${statusBadge(p.status)}</td><td>${esc(p.joinedAt||'—')}</td><td>${esc(p.lastSignal||'—')}</td><td><button class="link-btn" data-action="view-student" data-student="${p.id}" data-session="${s.id}">Chi tiết</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h3>Không có sinh viên phù hợp</h3><p>Thử thay đổi bộ lọc hoặc từ khóa tìm kiếm.</p><button class="link-btn" data-action="reset-roster-filter">Xóa bộ lọc</button></div>`}
function attentionList(s,c){const arr=s.participants.filter(p=>p.status==='attention'||p.status==='technical').slice(0,8);return arr.length?`<div class="list-stack" style="margin-top:12px">${arr.map(p=>`<div class="list-item"><div class="student-cell"><div class="mini-avatar">${esc(initials(p.name))}</div><div><div class="student-name">${esc(p.name)}</div><div class="student-id">${esc(p.lastSignal)}</div></div></div><button class="link-btn" data-action="view-student" data-student="${p.id}" data-session="${s.id}">Xem</button></div>`).join('')}</div>`:`<div class="empty" style="padding:25px 5px"><h3>Chưa có trường hợp cần xem lại</h3><p>Danh sách sẽ cập nhật khi có tín hiệu hoặc lỗi thiết bị.</p></div>`}
function recentSessionsTable(rows){return rows.length?`<div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Phiên</th><th>Lớp học phần</th><th>Loại</th><th>Bắt đầu</th><th>Đã tham gia</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows.map(s=>{const c=course(s.courseId),st=statsForSession(s);return `<tr><td><strong>${esc(s.title)}</strong><div class="student-id">${esc(s.id)}</div></td><td>${esc(c?.name||'')}</td><td>${s.type==='exam'?'Thi':'Học tập'}</td><td>${esc(s.startedLabel)}</td><td>${st.joined}/${st.total}</td><td>${badge(s.status,s.status==='Đang diễn ra'?'b-green':'b-grey')}</td><td><button class="link-btn" data-action="view-session" data-id="${s.id}">Xem dashboard →</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><h3>Chưa có phiên nào</h3><p>Các phiên bạn mở sẽ xuất hiện tại đây.</p></div>`}
function teacherSession(s){const c=course(s.courseId);if(s.status==='Đang diễn ra')return classOverview(c);const st=statsForSession(s);return shell(`<div class="breadcrumb"><button class="link-btn" data-action="open-course" data-id="${c.id}">${esc(c.name)}</button> / Chi tiết phiên</div>${head('CHI TIẾT PHIÊN',esc(s.title),`${esc(c.name)} · ${s.type==='exam'?'Phiên thi':'Phiên học'} · ${esc(s.startedLabel)}`,btn('Quay lại lớp','open-course','secondary','data-id="'+c.id+'"'))}<div class="grid grid-4"><div class="card metric"><div class="value">${st.total}</div><div class="label">Sĩ số lớp</div></div><div class="card metric"><div class="value">${st.joined}</div><div class="label">Đã tham gia</div></div><div class="card metric"><div class="value">${st.attention}</div><div class="label">Cần xem xét</div></div><div class="card metric"><div class="value">${st.technical}</div><div class="label">Lỗi thiết bị</div></div></div><div class="grid grid-2" style="margin-top:15px"><div class="card pad"><h2 class="section-title">Danh sách sinh viên</h2>${rosterRows(s,c)}</div><div class="card pad"><h2 class="section-title">Sự kiện của phiên</h2>${s.events.length?`<div class="signal-timeline">${s.events.map(e=>`<article><h4>${esc(e.time)} · ${esc(e.type)}</h4><p>${esc(e.description)}</p></article>`).join('')}</div>`:`<div class="empty"><h3>Chưa có sự kiện</h3></div>`}</div></div><div class="footer-note">Báo cáo chỉ tổng hợp dữ liệu đã ghi nhận trong phiên.</div>`, 'teacher-home')}
function teacherStudentDetail(){const s=selectedSession(),p=s?.participants.find(x=>x.id===state.selectedStudentId);const c=s?course(s.courseId):null;if(!s||!p)return `<div class="empty"><h3>Không tìm thấy thông tin sinh viên</h3>${btn('Quay lại lớp','teacher-course','secondary')}</div>`;return shell(`<div class="breadcrumb"><button class="link-btn" data-action="view-session" data-id="${s.id}">${esc(c.name)} · Dashboard phiên</button> / Chi tiết sinh viên</div>${head('CHI TIẾT SINH VIÊN',esc(p.name),`${esc(p.id)} · ${esc(c.name)} · ${esc(s.title)}`,btn('Quay lại dashboard lớp','view-session','secondary','data-id="'+s.id+'"'))}<div class="grid grid-3" style="margin-bottom:18px"><div class="card metric"><div class="value">${statusBadge(p.status)}</div><div class="label">Trạng thái hiện tại</div></div><div class="card metric"><div class="value">${esc(p.joinedAt||'—')}</div><div class="label">Thời điểm tham gia</div></div><div class="card metric"><div class="value">${p.events.length}</div><div class="label">Sự kiện trong phiên</div></div></div>${studentLiveMonitor(p)}<div class="student-detail-lower">${studentEvidenceGallery(p,s)}<div class="card pad"><h2 class="section-title">Lịch sử tín hiệu</h2><p class="section-sub">Các sự kiện được ghi nhận trong phiên, sắp xếp theo thứ tự phát sinh.</p>${p.events.length?`<div class="signal-timeline" style="margin-top:16px">${p.events.map(e=>`<article><h4>${esc(e.time)} · ${esc(e.type)}</h4><p>${esc(e.description)}</p></article>`).join('')}</div>`:`<div class="empty"><h3>Chưa có sự kiện</h3><p>Không có tín hiệu nào được ghi nhận trong dữ liệu demo.</p></div>`}<div class="divider"></div><h3 class="section-title">Thông tin và cách diễn giải</h3><div class="status-row"><span>Lớp</span><strong>${esc(c.name)}</strong></div><div class="status-row"><span>Phiên</span><strong>${esc(s.title)}</strong></div><div class="status-row"><span>Loại</span><strong>${s.type==='exam'?'Phiên thi':'Phiên học'}</strong></div><div class="status-row"><span>Tình trạng tham gia</span>${statusBadge(p.status)}</div><div class="notice info" style="margin-top:14px">Camera và ảnh chụp trên trang này đều là mô phỏng UI/UX. Trong sản phẩm thực tế, cần có thông báo, sự đồng ý phù hợp, phân quyền truy cập và chính sách lưu trữ dữ liệu rõ ràng.</div></div></div>`,'teacher-home')}

function studentHome(){const cs=db.courses.filter(c=>db.studentCourseIds.includes(c.id));const live=cs.map(c=>({c,s:activeSession(c.id)})).filter(x=>x.s);const recent=db.sessions.filter(s=>db.studentCourseIds.includes(s.courseId)).sort((a,b)=>b.startedAt.localeCompare(a.startedAt)).slice(0,4);return shell(`${head('KHÔNG GIAN SINH VIÊN',`Xin chào, ${esc(state.user.name)}`,'Xem các lớp học phần bạn đang theo học. Khi giảng viên mở phiên, thông báo sẽ xuất hiện ngay tại lớp tương ứng.',btn('Lịch sử học tập','student-history','secondary'))}${live.length?`<div class="card pad" style="margin-bottom:18px"><div class="row between wrap"><div><div class="eyebrow">THÔNG BÁO LỚP ĐANG DIỄN RA</div><h2 class="section-title">Bạn có ${live.length} phiên đang mở</h2><p class="section-sub">Chọn lớp để xem thông tin và tham gia phiên.</p></div>${badge('Đang diễn ra','b-green')}</div><div class="grid grid-2" style="margin-top:13px">${live.map(({c,s})=>`<div class="live-banner"><div><strong>${esc(c.name)}</strong><p>${s.type==='exam'?'Phiên thi':'Phiên học'} · ${esc(s.title)}</p></div>${btn('Vào lớp','open-student-course','primary','data-id="'+c.id+'"')}</div>`).join('')}</div></div>`:''}<div class="row between wrap" style="margin-bottom:12px"><div><h2 class="section-title">Lớp học phần của tôi</h2><p class="section-sub">Bạn có thể theo dõi nhiều lớp học phần trong cùng một học kỳ.</p></div>${badge(`${cs.length} lớp đã đăng ký`,'b-grey')}</div><div class="grid grid-2">${cs.map(c=>studentCourseCard(c)).join('')}</div><div class="card pad" style="margin-top:18px"><div class="row between"><div><h2 class="section-title">Hoạt động gần đây</h2><p class="section-sub">Các phiên học và thi thuộc lớp bạn tham gia.</p></div><button class="link-btn" data-route="student-history">Xem lịch sử →</button></div>${recent.length?`<div class="list-stack" style="margin-top:10px">${recent.map(s=>{const c=course(s.courseId);return `<div class="list-item"><div><strong style="font-size:11px">${esc(c.name)}</stro function studentCourseCard(c){const s=activeSession(c.id);const latest=sessionForCourse(c.id)[0];return `<article class="card course-card"><div class="course-strip" style="background:${c.color}"></div><div class="course-top"><div><div class="course-code">${esc(c.code)} · ${esc(c.section)}</div><div class="course-name">${esc(c.name)}</div><div class="course-meta"><span>${esc(c.teacher)}</span><span>${esc(c.schedule)} · ${esc(c.room)}</span></div></div>${s?badge('Có phiên mới','b-green'):badge('Đã đăng ký','b-grey')}</div>${s?`<div class="live-banner"><div><strong>${s.type==='exam'?'Giảng viên đã mở phiên thi':'Giảng viên đang mở phiên học'}</strong><p>${esc(s.title)}${s.note?' · '+esc(s.note):''}</p></div>${btn('Vào phiên','join-course-session','primary','data-id="'+s.id+'"')}</div>`:`<div class="small muted">${latest?`Hoạt động gần nhất: ${esc(latest.title)} · ${esc(latest.startedLabel)}`:'Chưa có phiên học nào được mở.'}</div>`}<div class="course-actions">${btn('Xem lớp học phần','open-student-course','secondary','data-id="'+c.id+'"')}${s?btn('Tham gia','join-course-session','soft','data-id="'+s.id+'"'):''}</div></article>`}
function studentCourseOverview(c){const s=activeSession(c.id);const hist=sessionForCourse(c.id);return shell(`<div class="breadcrumb"><button class="link-btn" data-route="student-home">Lớp học phần của tôi</button> / ${esc(c.code)}</div>${head('LỚP HỌC PHẦN',esc(c.name),`${esc(c.code)} · ${esc(c.section)} · ${esc(c.teacher)} · ${esc(c.schedule)}`,btn('Về trang chủ','student-home','secondary'))}${s?`<div class="card pad" style="margin-bottom:15px"><div class="live-banner"><div><div class="row wrap">${badge(s.type==='exam'?'PHIÊN THI':'PHIÊN HỌC',s.type==='exam'?'b-purple':'b-green')}${badge('Đang diễn ra','b-green')}</div><h2 class="section-title" style="margin-top:8px">${esc(s.title)}</h2><p>${esc(s.note||'Giảng viên đang mở phiên cho lớp. Hãy tham gia để được ghi nhận điểm danh.')}</p><p class="tiny muted">Bắt đầu ${esc(s.startedLabel)} · Dự kiến ${s.duration} phút</p></div>${btn('Vào phiên ngay','join-course-session','primary','data-id="'+s.id+'"')}</div></div>`:`<div class="notice info" style="margin-bottom:15px">Hiện chưa có phiên nào đang diễn ra. Khi giảng viên mở phiên, thông báo sẽ xuất hiện tại đây.</div>`}<div class="grid grid-2"><div class="card pad"><h2 class="section-title">Thông tin học phần</h2><div class="status-row"><span>Mã học phần</span><strong>${esc(c.code)}</strong></div><div class="status-row"><span>Lớp</span><strong>${esc(c.section)}</strong></div><div class="status-row"><span>Giảng viên</span><strong>${esc(c.teacher)}</strong></div><div class="status-row"><span>Lịch học</span><strong>${esc(c.schedule)}</strong></div><div class="status-row"><span>Phòng</span><strong>${esc(c.room)}</strong></div></div><div class="card pad"><h2 class="section-title">Phiên gần đây</h2>${hist.length?`<div class="list-stack" style="margin-top:8px">${hist.slice(0,4).map(x=>`<div class="list-item"><div><strong class="small">${esc(x.title)}</strong><div class="tiny muted">${esc(x.startedLabel)} · ${x.type==='exam'?'Thi':'Học tập'}</div></div>${badge(x.status,x.status==='Đang diễn ra'?'b-green':'b-grey')}</div>`).join('')}</div>`:`<div class="empty"><h3>Chưa có phiên</h3><p>Chưa có hoạt động được ghi nhận cho học phần này.</p></div>`}</div></div>`,'student-home')}

r" id="camera-placeholder"><div class="icon">▣</div><strong>Camera chưa bật</strong><p class="tiny">Bật camera hoặc chọn chế độ mô phỏng để tiếp tục.</p></div><span class="camera-status" id="camera-overlay">Chưa kết nối</span></div><div class="status-row"><span>Thiết bị</span><strong id="camera-state-label">Chưa kiểm tra</strong></div><div class="status-row"><span>Quyền truy cập</span><strong id="permission-state-label">Chưa yêu cầu</strong></div><div class="status-row"><span>Điều kiện tham gia</span><strong id="ready-state-label">Chưa sẵn sàng</strong></div></div></div>`,'student-home')}

 const s=selectedSession(),c=s?course(s.courseId):null,p=s?.participants.find(x=>x.id===state.user.studentId);
 if(!s||!c)return shell(`<div class="empty"><h3>Không tìm thấy phiên</h3>${btn('Trang chủ','student-home','secondary')}</div>`,'student-home');

 mắt trong một khoảng thời gian. Hãy kiểm tra lại trạng thái của mình.':'Bạn vẫn ổn chứ? Có thể bạn đang mệt. Hãy điều chỉnh tư thế hoặc nghỉ ngắn nếu cần.'}</span></div><div class="row wrap" style="margin-top:12px">${btn('Thử cảnh báo A','alert-a',state.alertVariant==='A'?'soft':'secondary')}${btn('Thử cảnh báo B','alert-b',state.alertVariant==='B'?'soft':'secondary')}${btn('Tạo tín hiệu minh họa','add-student-event','secondary')}</div></div></div><div class="footer-note">Tín hiệu trong phiên chỉ mang tính hỗ trợ. Không dùng một cảnh báo đơn lẻ để kết luận về mức độ tập trung.</div>`,'student-home');

}
function studentHistory(){const rows=db.sessions.filter(s=>db.studentCourseIds.includes(s.courseId)&&s.participants.some(p=>p.id===state.user.studentId)).sort((a,b)=>b.startedAt.localeCompare(a.startedAt));return shell(`${head('LỊCH SỬ CỦA TÔI','Các phiên đã tham gia','Lịch sử chỉ hiển thị các lớp học phần và phiên có liên quan đến tài khoản này.') }<div class="card pad"><div class="toolbar"><select class="select" id="student-history-course"><option value="">Tất cả học phần</option>${db.courses.filter(c=>db.studentCourseIds.includes(c.id)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><select class="select" id="student-history-type"><option value="">Tất cả loại phiên</option><option value="study">Học tập</option><option value="exam">Thi</option></select></div><div id="student-history-list" style="margin-top:14px">${studentHistoryRows(rows)}</div></div>`,'student-history')}
function studentHistoryRows(rows){return rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Phiên</th><th>Học phần</th><th>Loại</th><th>Thời gian</th><th>Tham gia</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(s=>{const c=course(s.courseId);const p=s.participants.find(x=>x.id===state.user.studentId);return `<tr><td><strong>${esc(s.title)}</strong><div class="student-id">${esc(s.id)}</div></td><td>${esc(c.name)}</td><td>${s.type==='exam'?'Thi':'Học tập'}</td><td>${esc(s.startedLabel)}</td><td>${esc(p?.joinedAt||'—')}</td><td>${badge(s.status==='Đang diễn ra'?'Đang diễn ra':'Đã kết thúc',s.status==='Đang diễn ra'?'b-green':'b-grey')}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><h3>Chưa có phiên phù hợp</h3><p>Tham gia một phiên học phần để lưu lịch sử tại đây.</p></div>`}
function teacherReports(){const rows=db.sessions.slice().sort((a,b)=>b.startedAt.localeCompare(a.startedAt));return shell(`${head('BÁO CÁO','Báo cáo các lớp học phần','Xem tổng hợp phiên học, phiên thi và tình hình tham gia theo từng lớp.',btn('Tải CSV','export-csv','secondary'))}<div class="card pad">${recentSessionsTable(rows)}</div>`,'teacher-reports')}
function render(){closeModal();if(!state.user){app.innerHTML=state.route==='register'?registerPage():state.route==='forgot'?forgotPage():loginPage();return}switch(state.route){case'teacher-home':app.innerHTML=teacherHome();break;case'teacher-course':app.innerHTML=classOverview(selectedCourse());break;case'teacher-session':app.innerHTML=teacherSession(selectedSession());break;case'teacher-student':app.innerHTML=teacherStudentDetail();break;case'teacher-reports':app.innerHTML=teacherReports();break;case'student-home':app.innerHTML=studentHome();break;case'student-course':app.innerHTML=studentCourseOverview(selectedCourse());break;case'student-prepare':app.innerHTML=studentPrepare();break;case'student-live':app.innerHTML=studentLive();attachLiveVideo();break;case'student-history':app.innerHTML=studentHistory();break;default:state.route=role()==='teacher'?'teacher-home':'student-home';render();}}

function openStudentCourse(id){state.selectedCourseId=id;routeTo('student-course')}
function createSession(form){const c=selectedCourse();if(activeSession(c.id)){toast('Lớp này đang có một phiên hoạt động.');return}const type=$('input[name="session-type"]:checked',form)?.value||'study';const title=$('#session-title',form).value.trim();if(!title){toast('Nhập tên phiên trước khi mở.');return}const now=new Date();const participants=c.roster.map(p=>({...p,status:'absent',joinedAt:'',lastSignal:'Chưa tham gia phiên',events:[]}));const s={id:`${c.code}-${Date.now().toString().slice(-5)}`,courseId:c.id,title,type:type==='exam'?'exam':'study',duration:Number($('#session-duration',form).value||60),note:$('#session-note',form).value.trim(),status:'Đang diễn ra',startedAt:now.toISOString(),startedLabel:now.toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'}),participants,attendanceSeeded:false,events:[]};db.sessions.push(s);state.selectedSessionId=s.id;save();closeModal();toast(`Đã mở ${type==='exam'?'phiên thi':'phiên học'} cho ${c.name}. Sinh viên trong lớp đã nhận thông báo.`);render()}
function seedAttendance(){const s=activeSession(state.selectedCourseId);if(!s||s.attendanceSeeded){toast('Không có dữ liệu mẫu để thêm.');return}const roster=s.participants;const now=new Date();roster.forEach((p,i)=>{if(i<Math.round(roster.length*.66)){p.status=i<Math.round(roster.length*.52)?'stable':'attention';p.joinedAt=new Date(now.getTime()-Math.floor(Math.random()*25)*60000).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});p.lastSignal=p.status==='stable'?'Chưa ghi nhận tín hiệu cần lưu ý':'Có tín hiệu cần xem lại';if(p.status==='attention')p.events.push({time:p.joinedAt,type:i%2?'Nhắm mắt kéo dài':'Nhìn lệch khỏi màn hình',description:'Tín hiệu minh họa cần được xem trong ngữ cảnh buổi học.',snapshotAvailable:true})}else if(i<Math.round(roster.length*.72)){p.status='technical';p.lastSignal='Camera bị gián đoạn';p.events.push({time:now.toLocaleTimeString('vi-VN'),type:'Mất tín hiệu camera',description:'Tín hiệu kỹ thuật minh họa.'})}});s.attendanceSeeded=true;s.events.push({time:now.toLocaleTimeString('vi-VN'),type:'Cập nhật dữ liệu minh họa',description:'Dữ liệu điểm danh mẫu được tạo để trình diễn dashboard.'});save();render();toast('Đã tạo trạng thái điểm danh minh họa cho lớp.')}
function joinSession(sessionId){const s=db.sessions.find(x=>x.id===sessionId&&x.status==='Đang diễn ra');if(!s){toast('Phiên này đã kết thúc hoặc không còn tồn tại.');return}const p=s.participants.find(x=>x.id===state.user.studentId);if(!p){toast('Tài khoản demo chưa có tên trong danh sách sinh viên lớp này.');return}state.selectedSessionId=s.id;state.selectedCourseId=s.courseId;state.cameraReady=false;state.privacyAccepted=false;state.paused=false;routeTo('student-prepare')}
function startStudentSession(){const s=selectedSession();if(!state.cameraReady||!state.privacyAccepted){toast('Hãy kiểm tra camera và xác nhận thông tin trước khi vào phiên.');return}const p=s.participants.find(x=>x.id===state.user.studentId);if(p){p.status='stable';p.joinedAt=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});p.lastSignal='Đã vào phiên';}s.events.push({time:new Date().toLocaleTimeString('vi-VN'),type:'Sinh viên tham gia',description:`${state.user.name} đã vào phiên.`});save();state.elapsed=0;state.paused=false;routeTo('student-live');startTimer();toast('Đã ghi nhận bạn tham gia phiên.')}
function startTimer(){clearInterval(state.timer);state.timer=setInterval(()=>{if(!state.paused){state.elapsed++;const el=$('#session-clock');if(el)el.textContent=formatTime(state.elapsed)}},1000)}
function formatTime(sec){const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function finishSession(sessionId){const s=db.sessions.find(x=>x.id===sessionId);if(!s)return;s.status='Đã kết thúc';s.endedAt=new Date().toISOString();s.endedLabel=new Date().toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});s.events.push({time:new Date().toLocaleTimeString('vi-VN'),type:'Kết thúc phiên',description:'Giảng viên đã kết thúc phiên.'});save();closeModal();toast('Đã kết thúc phiên. Sinh viên không thể tham gia phiên này nữa.');state.selectedSessionId=s.id;render()}
function confirmEndSession(id){const s=db.sessions.find(x=>x.id===id);modal('Kết thúc phiên này?',`Phiên “${esc(s?.title)}” sẽ chuyển sang trạng thái Đã kết thúc. Sinh viên sẽ không thể tham gia mới; dữ liệu điểm danh và sự kiện đã ghi vẫn được giữ.`,`<div class="modal-actions"><button class="btn secondary" data-action="close-modal">Tiếp tục phiên</button><button class="btn danger" data-action="end-session-confirm" data-id="${id}">Kết thúc phiên</button></div>`)}
async function requestCamera(){const msg=$('#camera-message'),overlay=$('#camera-overlay');if(msg)msg.textContent='Đang yêu cầu quyền camera…';try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Trình duyệt không hỗ trợ camera trong ngữ cảnh hiện tại.');const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});stopCamera();state.cameraStream=stream;state.cameraReady=true;const v=$('#camera-video');if(v){v.srcObject=stream;v.classList.remove('hidden')}$('#camera-placeholder')?.classList.add('hidden');if(msg)msg.textContent='Camera đã kết nối.';if(overlay)overlay.textContent='Camera đã kết nối';$('#camera-state-label')&&( $('#camera-state-label').textContent='Đã kết nối');$('#permission-state-label')&&( $('#permission-state-label').textContent='Đã cấp quyền');$('#ready-state-label')&&( $('#ready-state-label').textContent='Sẵn sàng');updateJoinButton()}catch(e){state.cameraReady=false;state.cameraError=e.message;if(msg)msg.textContent=e.name==='NotAllowedError'?'Bạn đã từ chối quyền camera. Hãy cấp quyền trong trình duyệt rồi thử lại.':e.message;if(overlay)overlay.textContent='Chưa kết nối';$('#camera-state-label')&&( $('#camera-state-label').textContent='Chưa kết nối');$('#permission-state-label')&&( $('#permission-state-label').textContent='Chưa được cấp');$('#ready-state-label')&&( $('#ready-state-label').textContent='Chưa sẵn sàng');updateJoinButton()}}
function simulateCameraReady(){stopCamera();state.cameraReady=true;$('#camera-placeholder')?.classList.remove('hidden');$('#camera-placeholder')&&($('#camera-placeholder').innerHTML='<div class="icon">✓</div><strong>Thiết bị đã sẵn sàng (mô phỏng)</strong><p class="tiny">Đang dùng camera mô phỏng cho buổi demo.</p>');$('#camera-message')&&( $('#camera-message').textContent='Đang sử dụng trạng thái camera mô phỏng.');$('#camera-overlay')&&( $('#camera-overlay').textContent='Sẵn sàng · mô phỏng');$('#camera-state-label')&&( $('#camera-state-label').textContent='Sẵn sàng (mô phỏng)');$('#permission-state-label')&&( $('#permission-state-label').textContent='Đã xác nhận mô phỏng');$('#ready-state-label')&&( $('#ready-state-label').textContent='Sẵn sàng');updateJoinButton()}
function updateJoinButton(){const b=$('#join-session-button');if(b)b.disabled=!(state.cameraReady&&$('#privacy-check')?.checked)}
function studentLeave(){clearInterval(state.timer);state.timer=null;stopCamera();const s=selectedSession();if(s){const p=s.participants.find(x=>x.id===state.user.studentId);if(p)p.lastSignal='Đã rời màn hình phiên';save()}routeTo('student-home');toast('Bạn đã rời màn hình phiên. Phiên của lớp vẫn tiếp tục nếu giảng viên chưa kết thúc.')}
function addStudentEvent(){const s=selectedSession();const p=s?.participants.find(x=>x.id===state.user.studentId);if(!s||!p)return;const now=new Date().toLocaleTimeString('vi-VN');p.status='attention';p.lastSignal='Có tín hiệu cần xem lại';p.events.push({time:now,type:'Nhắm mắt kéo dài',description:'Sự kiện minh họa do người thử nghiệm chủ động tạo.',snapshotAvailable:true});s.events.push({time:now,type:'Tín hiệu cần xem xét',description:`Tín hiệu minh họa của ${state.user.name}.`});save();render();toast('Đã thêm một tín hiệu minh họa để kiểm tra dashboard giảng viên.')}
function openTeacherStudent(studentId,sessionId){state.selectedStudentId=studentId;state.selectedSessionId=sessionId;state.teacherFeedPaused=false;routeTo('teacher-student')}
function filterRoster(){const s=selectedSession();if(!s)return;$('#roster-table').innerHTML=rosterRows(s,selectedCourse())}
function updateStudentHistory(){const courseId=$('#student-history-course')?.value||'',type=$('#student-history-type')?.value||'';const rows=db.sessions.filter(s=>db.studentCourseIds.includes(s.courseId)&&(!courseId||s.courseId===courseId)&&(!type||s.type===type)&&s.participants.some(p=>p.id===state.user.studentId)).sort((a,b)=>b.startedAt.localeCompare(a.startedAt));$('#student-history-list').innerHTML=studentHistoryRows(rows)}
function reportsCsv(){const rows=db.sessions.map(s=>{const c=course(s.courseId),st=statsForSession(s);return [s.id,s.title,c?.name,s.type==='exam'?'Thi':'Học tập',s.startedLabel,s.status,st.total,st.joined,st.stable,st.attention,st.technical,st.absent]});const all=[['Mã phiên','Tên phiên','Lớp','Loại','Bắt đầu','Trạng thái','Sĩ số','Đã tham gia','Ổn định','Cần xem xét','Lỗi thiết bị','Chưa tham gia'],...rows];const csv='\ufeff'+all.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='edufocus-bao-cao-phien.csv';a.click();URL.revokeObjectURL(url)}
function renderReports(){return teacherReports()}
document.addEventListener('click',e=>{
 const route=e.target.closest('[data-route]');if(route){routeTo(route.dataset.route);return}
 const navAction=e.target.closest('[data-action]');if(!navAction)return;const a=navAction.dataset.action,id=navAction.dataset.id;
 if(a==='logout'){logout();return}if(a==='reset-demo'){db=defaultData();try{localStorage.removeItem(KEY)}catch(e){}state.user=null;state.route='login';state.selectedSessionId=null;state.cameraReady=false;render();toast('Đã đặt lại dữ liệu demo.');return}if(a==='close-modal'){closeModal();return}if(a==='overlay-close'){closeModal();return}
 if(a==='open-course'){openCourse(id);return}if(a==='open-course-session'){openCourse(id);openSessionModal();return}if(a==='open-student-course'){openStudentCourse(id);return}if(a==='join-course-session'){joinSession(id);return}if(a==='open-session-modal'){openSessionModal();return}
 if(a==='view-session'){const s=db.sessions.find(x=>x.id===id);if(s){state.selectedCourseId=s.courseId;state.selectedSessionId=id;routeTo('teacher-session')}return}
 if(a==='confirm-end-session'){confirmEndSession(id);return}if(a==='end-session-confirm'){finishSession(id);return}if(a==='open-class-report'){state.selectedSessionId=id;routeTo('teacher-session');return}
 if(a==='seed-attendance'){seedAttendance();return}if(a==='view-student'){openTeacherStudent(navAction.dataset.student,navAction.dataset.session);return}if(a==='view-snapshot'){openSnapshotModal(navAction.dataset.student,navAction.dataset.session,navAction.dataset.eventIndex);return}if(a==='toggle-camera-wall'){state.classCameraExpanded=!state.classCameraExpanded;render();return}if(a==='toggle-student-feed'){state.teacherFeedPaused=!state.teacherFeedPaused;render();return}
 if(a==='reset-roster-filter'){state.rosterFilter='all';state.rosterQuery='';render();return}
 if(a==='request-camera'){requestCamera();return}if(a==='simulate-camera-ready'){simulateCameraReady();return}if(a==='start-student-session'){startStudentSession();return}
 if(a==='pause-student'){state.paused=true;clearInterval(state.timer);render();toast('Đã tạm dừng bộ đếm trong bản demo.');return}if(a==='resume-student'){state.paused=false;startTimer();render();return}if(a==='leave-student-session'){studentLeave();return}
 if(a==='alert-a'){state.alertVariant='A';render();return}if(a==='alert-b'){state.alertVariant='B';render();return}if(a==='add-student-event'){addStudentEvent();return}if(a==='export-csv'){reportsCsv();return}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='login-form'){const email=$('#login-email').value.trim().toLowerCase(),pass=$('#login-password').value,err=$('#login-error');if(pass!==DEMO_PASSWORD||!['teacher@demo.test','student@demo.test'].includes(email)){err.classList.remove('hidden');return}if(email.startsWith('teacher')){state.user={name:'Nguyễn Minh Khôi',role:'teacher',email};state.route='teacher-home'}else{state.user={name:'Nguyễn Minh An',studentId:'2420001',role:'student',email};state.route='student-home'}db.user=state.user;save();render();return}
 if(e.target.id==='create-session-form'){createSession(e.target);return}if(e.target.id==='register-form'){const pass=$('#reg-pass').value,confirm=$('#reg-confirm').value;if(pass!==confirm){$('#reg-error').textContent='Mật khẩu xác nhận không khớp.';$('#reg-error').classList.remove('hidden');return}if(pass.length<8){$('#reg-error').textContent='Mật khẩu cần ít nhất 8 ký tự.';$('#reg-error').classList.remove('hidden');return}toast('Đăng ký đã được mô phỏng. Bản demo sẽ dùng tài khoản sinh viên tạo sẵn để đăng nhập.');routeTo('login');return}if(e.target.id==='forgot-form'){$('#forgot-result').classList.remove('hidden');return}});
document.addEventListener('change',e=>{if(e.target.id==='privacy-check'){state.privacyAccepted=e.target.checked;updateJoinButton()}if(e.target.name==='session-type'){$$('.session-choice').forEach(x=>x.classList.toggle('selected',!!$('input:checked',x)))}if(e.target.id==='student-history-course'||e.target.id==='student-history-type')updateStudentHistory()});
document.addEventListener('input',e=>{if(e.target.id==='roster-search'){state.rosterQuery=e.target.value;filterRoster()}});
document.addEventListener('click',e=>{const f=e.target.closest('[data-roster-filter]');if(f){state.rosterFilter=f.dataset.rosterFilter;$$('[data-roster-filter]').forEach(x=>x.classList.toggle('active',x===f));filterRoster()}});
document.addEventListener('visibilitychange',()=>{
 const s=state.route==='student-live'?selectedSession():null;
 if(!s||s.type!=='exam'||s.status!=='Đang diễn ra'||state.paused)return;
 if(document.hidden){const p=s.participants.find(x=>x.id===state.user?.studentId);if(p){const now=new Date().toLocaleTimeString('vi-VN');const ev={time:now,type:'Chuyển khỏi tab',description:'Trình duyệt ghi nhận trang phiên thi chuyển sang trạng thái không hiển thị. Sự kiện này không tự chứng minh gian lận.'};p.status='attention';p.lastSignal='Trang chuyển sang trạng thái không hiển thị';p.events.push(ev);s.events.push(ev);save()}}
 else {toast('Hệ thống ghi nhận trang vừa chuyển khỏi trạng thái hiển thị. Đây là sự kiện trình duyệt, không phải kết luận vi phạm.')}
});
window.addEventListener('storage',e=>{if(e.key===KEY){db=load();if(state.user)render()}});
window.addEventListener('beforeunload',()=>stopCamera());
render();
})();
</script>
</body>
