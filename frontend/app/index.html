<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduFocus — Quản lý lớp học &amp; phiên học</title>

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2334745e'/><text y='72' x='50' text-anchor='middle' font-size='58' font-weight='900' fill='white' font-family='system-ui'>E</text></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles (order matters) -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/camera.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    /* Fallback font if Google Fonts unavailable */
    body { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }

    /* Loading spinner shown before JS loads */
    #app:empty::after {
      content: '';
      display: block;
      width: 36px;
      height: 36px;
      border: 3px solid #e2e9e1;
      border-top-color: #34745e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 25vh auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal styling supplement */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(25, 43, 33, 0.48);
      backdrop-filter: blur(3px);
      display: grid;
      place-items: center;
      z-index: 30;
      padding: 16px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }
    .modal-title { font-size: 19px; font-weight: 750; }
    .modal-close {
      border: 0;
      background: #f1f5f1;
      color: #52665b;
      border-radius: 9px;
      width: 36px;
      height: 36px;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    .modal-body { font-size: 13px; line-height: 1.6; color: var(--muted); margin-bottom: 16px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
